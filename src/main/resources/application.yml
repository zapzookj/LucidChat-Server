server:
  port: 8080

app:
  admin:
    bootstrap-usernames: zapzook

spring:
  # 기본으로 local과 characters 프로필을 함께 실행하도록 설정
  profiles:
    active: local, characters, worlds, v2

  codec:
    max-in-memory-size: 10MB
  ai:
    openai:
      embedding-model: text-embedding-3-small

  # OAuth2 클라이언트 정보 (Secret 등은 환경변수로 주입)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-name: Naver
            provider: naver
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  # Flyway — 신규 테이블/컬럼 마이그레이션. 기존 스키마는 baseline(0)으로 처리하고
  # 본 프로젝트에 추가되는 신규 오브젝트만 V1부터 버전 관리한다.
  # (prod는 ddl-auto=validate 이므로 신규 테이블은 반드시 Flyway로 생성되어야 함)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 9

# [2026-08-06 종원 확정 B안] 채팅 2-Step 모더레이션 게이트 — 기본 off.
# Step 2(OpenAI 모더레이션)가 401 failsafe 무력화 상태라 Step 1 키워드가 유일 판정자로
# 서사 어휘('몰살' 등)를 오탐 차단(프로드 실측) → 런칭 전 재설계까지 전체 비활성.
moderation:
  chat-enabled: ${CHAT_MODERATION_ENABLED:false}

# [블록 D · docs/14 §C#6] 레거시 미연시 문법 게이트 — "코드 보존, 진입만 차단"이 원칙.
#   삭제가 아니라 노브인 이유: 되살릴 여지를 남기고, 되살릴 때 데이터 정합이 이미 맞아 있어야 하기 때문.
#   ⚠ 게이트는 반드시 **서버측**이다. 프론트 진입점만 지우면 API가 소유권 검사만으로 열린 채 남는다
#      (beta-activate가 정확히 그 실수였다 — docs/14_assets §5).
legacy:
  ending:
    # 자유(SANDBOX)·스토리(V2 STORY) 엔딩. 극장 엔딩(TheaterFinalityController)은
    # §C#6에서 '유지' 확정이라 이 플래그의 사정권 밖이다.
    dialogue-enabled: ${LEGACY_ENDING_DIALOGUE_ENABLED:false}
  achievement:
    # 업적 '지급·갤러리·해금 모달'만 차단한다. 이스터에그 *연출*은 §C#6에서 유지 확정 —
    # EasterEggEvent는 계속 내려가고 achievement 필드만 null이 된다(FE는 이미 옵셔널 체이닝).
    enabled: ${LEGACY_ACHIEVEMENT_ENABLED:false}
  illustration:
    # §G-6 레거시 캐릭터 일러(ModelsLab CG) 트랙 — 씬 일러로 일원화·동결.
    # 지금도 FE에서 살아 있어 유저 10E가 환불 없이 소각 가능하다(docs/13 D-2.h).
    legacy-cg-enabled: ${LEGACY_CG_ILLUSTRATION_ENABLED:false}
  unlock:
    # §G-5 복장·장소 '관계 단계별 해금'. 복장/장소 값 자체는 살아있는 연출 변수다 —
    # 죽이는 건 LOCK 규칙뿐(impl_spec §5 명시). UGC 복장이 1종이라 공식 4캐릭 전용 no-op였다.
    relation-gated: ${LEGACY_RELATION_UNLOCK_ENABLED:false}

# 외부 API 공통 설정
nice:
  client-id: YOUR_NICE_CLIENT_ID
  client-secret: YOUR_NICE_CLIENT_SECRET
  product-id: YOUR_NICE_PRODUCT_ID
  return-url: https://yourdomain.com/verify/callback
  api-url: https://svc.niceapi.co.kr:22001

portone:
  api-key: YOUR_PORTONE_API_KEY
  api-secret: YOUR_PORTONE_API_SECRET
  api-url: https://api.iamport.kr

auth:
  jwt:
    issuer: aichat
    secret: ${JWT_SECRET_BASE64}          # Base64 인코딩된 256bit 이상 시크릿 권장
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 1209600

openai:
  api-key: ${OPENROUTER_API_KEY}
  base-url: https://openrouter.ai/api/v1
  model: google/gemini-3-flash-preview
  sentiment-model: google/gemini-3-flash-preview
  app-referer: https://your-service.com
  app-title: ai-character-chat
  pro-model: google/gemini-3.1-pro-preview

# Fal.ai
fal:
  api-key: ${FAL_API_KEY}
  flux-model: fal-ai/flux-2

# ────────────────────────────────────────────────
# ModelsLab — 캐릭터 일러스트 트랙 (SDXL anime + 다중 LoRA + NSFW 정식)
# ────────────────────────────────────────────────
# Secret Mode 분위기 배경도 이 트랙 활용 (BackgroundGenerationService가 자동 분기).
#
# Endpoint는 PoC 결과에 따라 yml로 토글 가능:
#   /lora/text2img    → 다중 LoRA 적용 가능
#   /images/text2img  → 표준 stable diffusion
#   /realtime/text2img → 가장 빠른 동기 응답
modelslab:
  api-key: ${MODELSLAB_API_KEY}
  base-url: https://modelslab.com/api/v6
  text2img-endpoint: /images/text2img
  fetch-endpoint:    /images/fetch
  default-model-id:  ${MODELSLAB_DEFAULT_MODEL_ID}     # PoC 후속 주입 (NoobAI/Illustrious/Animagine 등)
  webhook-base-url:  ${LUCID_WEBHOOK_BASE}
  webhook-secret:    ${MODELSLAB_WEBHOOK_SECRET}

  # 글로벌 보조 LoRA — 옵션 (캐릭터별 정체성 LoRA는 IllustrationPromptAssembler에서 동적 주입)
  # PoC 단계에선 빈 문자열 또는 미지정 → 효과 미적용
#  detail-lora-id:     ${MODELSLAB_DETAIL_LORA_ID:}
#  detail-lora-weight: 0.4
#  style-lora-id:      ${MODELSLAB_STYLE_LORA_ID:}
#  style-lora-weight:  0.5

  # 생성 파라미터 기본값
  width: 1024
  height: 1024
  steps: 30
  guidance-scale: 7.0
  sampler: "DPMSolverMultistepScheduler"

# ────────────────────────────────────────────────
# [2026-07-30 A-1 재피벗] 실시간 씬 일러 — 전용 RunPod Serverless (lucid_comfy_worker_illu)
# ────────────────────────────────────────────────
# 기본 비활성 — 켜기 전까지 채팅/일러 흐름에 어떤 변화도 없다.
# 활성 절차: ① 전용 엔드포인트 가동(웜 워커 권장 — 콜드스타트 8분+ 실측)
#           ② SCENE_RUNPOD_* env 주입 ③ SCENE_ILLUST_ENABLED=true
# UGC 빌더(ugc.runpod.*)와 별개 엔드포인트 — 배치 vs 저지연 head-of-line blocking 회피(docs/07 B-2).
illustration:
  scene:
    enabled: ${SCENE_ILLUST_ENABLED:true}
    # [2026-07-31 에픽 B] 트리거: manual=유저 요청+전용 프롬프트 라이터(기본, 5에너지·실패 환불)
    #                     auto=채팅 LLM 인밴드 매턴(휴면 보존 — 프리미엄/이벤트 재활성 대비)
    trigger: ${SCENE_ILLUST_TRIGGER:manual}
    energy-cost: 5
    director:
      # 씬 디렉터(대화 맥락→L1 규약 스펙) — 미지정 시 openai.model(gemini-3-flash) 폴백 후 튜닝.
      # 구조화 태스크 비사고 모델 규율(docs/09 §B-3) — 사고 모델 지정 금지.
      model: ${SCENE_DIRECTOR_MODEL:}
    runpod:
      api-key: ${UGC_RUNPOD_API_KEY:}
      endpoint-id: ${SCENE_RUNPOD_ENDPOINT_ID:}
    generation:
      width: 1344     # 실측 확정(docs/09 A-1): 배경 포함 랜드스케이프, 30step/cfg4는 템플릿 동결
      height: 768

# AWS S3
aws:
  s3:
    bucket-name: "lucid-chat-assets-v2"
    region: "ap-northeast-2"
    access-key: "${AWS_ACCESS_KEY}"
    secret-key: "${AWS_SECRET_KEY}"
    assets-url: "${CLOUDFRONT_ASSETS_URL}"

# ────────────────────────────────────────────────
# UGC 캐릭터 생성 파이프라인 (스튜디오)
# ────────────────────────────────────────────────
# 이미지 트랙: WF-1/2/3 = RunPod Serverless(worker-comfyui 5.x, ugc.runpod.* 전용 네임스페이스 —
# 레거시 runpod.*와 무관) · 자세/감정 편집 = fal.ai Qwen(기존 FAL_API_KEY 재사용, SDK subscribe).
# 실값(엔드포인트 ID/키/시크릿)은 환경변수로 주입 — 미설정 시 빈 값으로 기동은 되되 호출 시점 검증.
ugc:
  # [2026-07-31 에픽 A] UGC 월드 STORY/THEATER 개방 게이트 — 기본 off(스키마·플래그는 휴면 선반영).
  # 격리 확정: 개방 대상은 'UGC 캐릭터 + UGC 월드' 조합만 — 공식 월드 캐스트에는 절대 미합류.
  modes:
    story-enabled: ${UGC_STORY_ENABLED:true}
    theater-enabled: ${UGC_THEATER_ENABLED:true}
    # [2026-08-04 남캐] 남성 캐릭터 빌더 — 로컬 튜닝 개방(2026-08-04 종원 테스트).
    # ⚠ 전제: UGC 엔드포인트가 male_type.safetensors 베이크 이미지(lucid-comfy-worker 3fb2dd0+
    # 리빌드본)로 교체돼 있어야 함 — 구이미지면 황금샷 렌더 실패(잡 FAILED·전액 환불).
    # ⚠ 푸시 전 프로드 정책 결정 필요(기본 false 복원 or 태스크 def env 명시).
    male-builder-enabled: ${UGC_MALE_BUILDER_ENABLED:true}
  # ⚠ stage0-model은 ugc 루트 키 — runpod 하위에 두면 조용히 무시된다 (2026-07-22 실측 수정)
  stage0-model: openai/gpt-5.6-sol  # [튜닝] Stage0/W0 구조화 전용 LLM (미지정 시 openai.model — 외형 태그 품질이 황금샷을 좌우)
  # [2026-07-30 P0 PoC-5] VLM 이미지 프리필터 — 공개 신청 시점 자문 스캔(자동 차단 아님, 기본 비활성)
  vlm-prefilter:
    enabled: ${UGC_VLM_PREFILTER_ENABLED:false}
    model: ${UGC_VLM_PREFILTER_MODEL:google/gemini-3-flash-preview}  # 비전 지원 비사고 모델
    max-images: 2   # 캐릭터당 검사 상한(썸네일+기본 스탠딩)
  energy:
    base-package-cost: 20     # [레거시 표시·폴백용 존치] 선차감 시절 단일 패키지 — 2026-08-04 단계 과금 개편으로 신규 잡은 미사용
    # [2026-08-04 단계 과금] 단계 진입 시 차감 (합 20 유지 — 선차감 총액과 동일).
    # 배분은 실측 원가 비중 — 감정 스테이지가 원가 60%+, 누끼 5% 미만 (docs/03 §4)
    stage-start-cost: 6       # 시작(컨셉 구조화 + 황금샷 1배치)
    stage-standing-cost: 4    # 황금샷 선택 → 스탠딩 후보 파생 진입
    stage-emotions-cost: 8    # 스탠딩 확정 → 감정 14종 파생 진입 (원가 최대 구간)
    stage-finalize-cost: 2    # 검수 확정 → 누끼·바인딩 진입
    golden-reroll-cost: 2     # 황금샷 배치 리롤
    base-reroll-cost: 2      # 스탠딩 후보 배치 리롤 (2026-07-20 개편)
    emotion-reroll-cost: 2    # 감정 1컷 리롤
  job:
    wait-ttl-hours: 72        # *_WAIT 방치 만료
    stage-auto-retries: 2     # 스테이지 자동 재시도(무과금)
    emotion-max-retries: 3    # 감정 컷 개별 재시도 상한
    poll-fallback-seconds: 15 # webhook 유실 대비 폴링 주기 (웹훅 미구성 로컬에서도 체감 지연 최소화 — 2026-07-20 60→15)
  runpod:
    api-key: ${UGC_RUNPOD_API_KEY:}
    endpoint-id: ${UGC_RUNPOD_ENDPOINT_ID:}
    webhook-base-url: ${LUCID_WEBHOOK_BASE:}
    webhook-secret: ${UGC_RUNPOD_WEBHOOK_SECRET:}
  qwen:
    model: fal-ai/qwen-image-edit-2511
    # use-negative-prompt: false  # [튜닝] 네거티브 비우기 실험 노브 — 실측상 빈 쪽이 나은 관찰, A/B 후 전환
  generation:
    golden-batch-size: 2      # 2026-07-20 개편: 4→2 (스탠딩 후보 선택 단계 신설 — 황금샷은 썸네일·원화 확정용)
    # male-lora-strength: 0.9 # [2026-08-04 남캐] Male_Type LoRA strength_model — PoC 매트릭스 확정, 미지정 시 0.9
    # male-negative: "..."    # [2026-08-04 방향 전환] 남성 잡 추가 네거티브 — 기본 off(비상 수동 개입 전용, 미학 유도는 Stage0 브리프 담당)
    # refine-denoise: 0.4     # 품질 튜닝 노브(0.30~0.45) — 미지정 시 템플릿 검증값 유지
    # bg-emphasis-weight: 1.3 # [튜닝] WF-2 배경 보색 어텐션 가중치(1.1~1.5) — 누끼 경계 품질
  world:                      # [세계관 빌더] fal flux-2 전용 트랙 (RunPod/Qwen 불필요 — FAL_API_KEY만)
    base-package-cost: 10     # 기본 패키지: W0 구조화 + 썸네일 1 + 장소 배경(제안 6, 상한 10)
    reroll-cost: 1            # 썸네일·장소 배경 리롤 각 1
    wait-ttl-hours: 72        # EDIT_WAIT/REVIEW_WAIT 방치 만료 (캐릭터와 동일값·독립 키)
    stale-sweep-minutes: 30   # fal 전용이라 웹훅/폴링 폴백 없음 — 무진행 PROCESSING 잡 회수/환불 기준
    max-locations: 20         # 장소 상한 (LLM 제안 6 + 유저 추가 — 2026-07-22 10→20 상향)














