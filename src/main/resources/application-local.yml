spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/aichat
    username: postgres
    password: wkqwnr123

  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/lucidchat
      auto-index-creation: true

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          naver:
            redirect-uri: http://localhost:8080/login/oauth2/code/naver

auth:
  oauth2:
    success-redirect: http://localhost:5173/oauth2/success

fal:
  webhook-base-url: "http://localhost:8080"
  use-webhook: false  # 로컬은 폴링 사용

# [2026-08-05 S3 격리 — 사고 재발 대응·종원 승인] 로컬은 전용 dev 버킷 사용.
# 프로드(lucid-chat-assets-v2)와 잡 ID 기반 키(characters/ugc-{jobId}/)가 충돌해
# 상호 덮어쓰기 사고 2회(07-30, 08-05 발견) — 로컬↔프로드 물리 격리가 근본 픽스.
aws:
  s3:
    bucket-name: "lucid-chat-assets-dev"
    assets-url: "https://lucid-chat-assets-dev.s3.ap-northeast-2.amazonaws.com"

ugc:
  generation:
    # [2026-08-04 남캐 Phase 3] H안 확정 네거티브 팩 — 야경 청보라 통계의 피부 송장톤 상쇄 (PoC 실측: 한색 시드에서도 웜톤 복원).
    # ⚠ pale skin 네거티브는 서이한(혈색) 검증용 — 창백 컨셉(백서월 등) 교차 검증 시 이 항목만 빼고 재기동할 것.
    male-negative: "blue theme, purple theme, greyscale, monochrome, pale skin"