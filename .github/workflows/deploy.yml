# [2026-08-18 탈AWS] ECS/ECR → GHCR + Vultr SSH 배포로 전환 — 정본: docs/20 §6
# 필요 GitHub Secrets: DEPLOY_HOST(VPS IP), DEPLOY_USER(root), DEPLOY_SSH_KEY(개인키 PEM)
name: Deploy backend to Vultr

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR push

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zapzookj/lucid-chat-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # AichatApplicationTests(@SpringBootTest 컨텍스트 로드)는 DB/외부 env가 필요해 CI에서 제외.
      # '*Test' 패턴은 유닛 테스트(…Test)만 매칭하고 …Tests는 건너뛴다.
      - name: Build jar (unit tests only)
        run: |
          chmod +x ./gradlew
          ./gradlew clean test --tests '*Test' bootJar --no-daemon

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/lucid/deploy.sh
          command_timeout: 10m
